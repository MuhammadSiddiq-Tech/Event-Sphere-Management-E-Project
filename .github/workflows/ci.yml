name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**', 'docs/**']
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - name: Run server tests
        run: npm test --passWithNoTests -w server
        env:
          NODE_ENV: test
          PORT: 5000
          MONGO_URI: mongodb://localhost:27017/eventsphere
          JWT_ACCESS_SECRET: ci-test-access-secret-32chars-x
          JWT_REFRESH_SECRET: ci-test-refresh-secret-32chars-x
          CLIENT_URL: http://localhost:5173
          ACCESS_TOKEN_TTL: 15m
          REFRESH_TOKEN_TTL: 7d
          BCRYPT_ROUNDS: 10
      - run: npm audit --audit-level=high

  build:
    name: Build Client
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build -w client
